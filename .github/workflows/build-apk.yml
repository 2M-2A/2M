name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias de Buildozer y Android
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev
        pip install --upgrade pip
        pip install --user Cython==0.29.36 buildozer

    - name: Compilar APK con Buildozer
      working-directory: ./app_movil_2m
      run: |
        export PATH=$PATH:~/.local/bin
        yes | buildozer -v android debug || true
        buildozer -v android debug

    - name: Subir el APK generado (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: apk-celular
        path: app_movil_2m/bin/*.apk
